name: Title Check

permissions:
  contents: read

concurrency:
  group: title-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  title-check:
    name: Title Check
    # Skip in forks of this repository.
    if: github.repository == 'deepgram/deepgram-go-sdk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install commitlint
        run: npm ci --prefix .github --ignore-scripts

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx --prefix .github commitlint -g .github/.commitlintrc.json
